name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GH_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync to GCS
        run: gsutil -m rsync -r -d out/ gs://inmyflat.com/

      - name: Set cache headers
        run: |
          # No-cache for HTML, sitemap, robots.txt
          gsutil -m setmeta -h "Cache-Control:public, max-age=0, must-revalidate" \
            -r gs://inmyflat.com/

          # Long-lived cache for Next.js hashed assets
          gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
            -r gs://inmyflat.com/_next/static/
